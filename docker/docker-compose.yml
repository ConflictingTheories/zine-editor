services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: void-press-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./server/data:/app/server/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-dev_docker_secret_must_be_changed_in_prod}
      - DB_PATH=/app/server/data/database.sqlite
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      # Economy Configuration
      - XRPL_NODE_URL=wss://s.altnet.rippletest.net:51233
      - PLATFORM_WALLET_SEED=${PLATFORM_WALLET_SEED:-snq8}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef}
    networks:
      - void-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api}
    container_name: void-press-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=/api
    networks:
      - void-net

volumes:
  postgres_data:


networks:
  void-net:
    driver: bridge
