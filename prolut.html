    async function runSingleBatchJob(file, spec, baseName) {
      // 1. decode (RAW or native)
      const bmp = await decodeAny(file);

      // 2. draw at max dim
      const cw = bmp.width || bmp.naturalWidth;
      const ch = bmp.height || bmp.naturalHeight;
      const scale = Math.min(1, spec.maxDim / Math.max(cw, ch));
      const outW = Math.max(1, Math.round(cw * scale));
      const outH = Math.max(1, Math.round(ch * scale));

      const c = document.createElement('canvas');
      c.width = outW; c.height = outH;
      const cx = c.getContext('2d', { willReadFrequently: true });
      cx.drawImage(bmp, 0, 0, outW, outH);

      // 3. grade
      const img = cx.getImageData(0, 0, outW, outH);
      const pipeline = buildPipeline(P);
      pipeline.processImageData(img);
      if (P.luts.length) applyLUTsToImageData(img, P.luts);
      cx.putImageData(img, 0, 0);

      // 4. effects — render through an offscreen mushu-flow instance
      let outCanvas = c;
      if (P.effectsEnabled && P.effects.some(e => e.enabled)) {
        outCanvas = await renderEffectsOffscreen(c);
      }

      // 5. encode
      const fmt = spec.format === 'png' ? 'image/png'
        : spec.format === 'webp' ? 'image/webp'
          : 'image/jpeg';
      const lossy = fmt !== 'image/png';
      const blob = await new Promise(r => outCanvas.toBlob(r, fmt, lossy ? spec.quality : undefined));
      const ext = spec.format === 'jpeg' ? 'jpg' : spec.format;

      // 6. download + manifest
      const stem = file.name.replace(/\.[^.]+$/, '');
      const manifest = buildManifest(P, {
        name: file.name, width: cw, height: ch,
        source: bmp.__meta?.source ?? 'native',
        exif: bmp.__meta?.exif ?? null,
      }, { format: spec.format, width: outW, height: outH, quality: lossy ? spec.quality : null });

      download(blob, `${stem}.${ext}`);
      await new Promise(r => setTimeout(r, 120));
      download(new Blob([JSON.stringify(manifest, null, 2)], { type: 'application/json' }), `${stem}.manifest.json`);
      await new Promise(r => setTimeout(r, 120));
    }

    async function renderEffectsOffscreen(sourceCanvas) {
      const gl = document.createElement('canvas');
      gl.width = sourceCanvas.width;
      gl.height = sourceCanvas.height;

      const depth = document.createElement('canvas');
      depth.width = gl.width; depth.height = gl.height;
      const dctx = depth.getContext('2d');
      dctx.fillStyle = '#fff'; dctx.fillRect(0, 0, depth.width, depth.height);

      const eth = document.createElement('canvas');
      eth.width = ETH_W; eth.height = ETH_H;
      const ectx = eth.getContext('2d', { willReadFrequently: true });
      const img = ectx.createImageData(ETH_W, ETH_H);
      for (let i = 0; i < img.data.length; i += 4) { img.data[i] = 128; img.data[i + 3] = 255; }
      // pack masks
      const active = P.effects.filter(e => e.enabled).slice(0, MAX_EFFECTS);
      let maskRow = 0;
      for (let i = 0; i < active.length; i++) {
        const e = active[i];
        if (e.mask && maskRow < MAX_MASKS) {
          const lut = makeCurveLUT(e.mask.points);
          for (let x = 0; x < ETH_W; x++) {
            const v = Math.round(evalLUT(lut, x / (ETH_W - 1)) * 255);
            const idx = (maskRow * ETH_W + x) * 4;
            img.data[idx] = v;
          }
          maskRow++;
        }
      }
      ectx.putImageData(img, 0, 0);

      // local uniform arrays
      const localEffect = {
        count: active.length,
        type: new Float32Array(MAX_EFFECTS).fill(-1),
        p0: new Float32Array(MAX_EFFECTS),
        p1: new Float32Array(MAX_EFFECTS),
        speed: new Float32Array(MAX_EFFECTS),
        phase: new Float32Array(MAX_EFFECTS),
        maskRow: new Float32Array(MAX_EFFECTS).fill(-1),
      };
      const localMask = {
        channel: new Float32Array(MAX_MASKS),
        rangeMin: new Float32Array(MAX_MASKS),
        rangeMax: new Float32Array(MAX_MASKS),
        spread: new Float32Array(MAX_MASKS),
        weight: new Float32Array(MAX_MASKS),
        invert: new Float32Array(MAX_MASKS),
      };
      let row = 0;
      for (let i = 0; i < active.length; i++) {
        const e = active[i];
        localEffect.type[i] = EFFECT_TYPE_INDEX[e.typeId] ?? -1;
        localEffect.p0[i] = e.params.p0 ?? 0;
        localEffect.p1[i] = e.params.p1 ?? 0;
        localEffect.speed[i] = e.speed ?? 1;
        localEffect.phase[i] = e.phase ?? 0;
        if (e.mask && row < MAX_MASKS) {
          localEffect.maskRow[i] = row;
          localMask.channel[row] = ETH_CHANNEL_INDEX[e.mask.channel] ?? 0;
          localMask.rangeMin[row] = e.mask.rangeMin;
          localMask.rangeMax[row] = e.mask.rangeMax;
          localMask.spread[row] = e.mask.spread;
          localMask.weight[row] = e.mask.weight;
          localMask.invert[row] = e.mask.invert ? 1 : 0;
          row++;
        }
      }

      if (!effectShaderSrc) effectShaderSrc = buildEffectShaderSource();

      const stage = flow(gl)
        .use(texture(sourceCanvas, { name: 'uSource', unit: 0, flipY: true }))
        .use(texture(depth, { name: 'uDepthMap', unit: 1, flipY: true }))
        .use(texture(eth, { name: 'uEthereal', unit: 2, flipY: false }))
        .use(shader(effectShaderSrc, {
          uniforms: {
            uTime: () => 0,
            uGlobalIntensity: () => 1.0,
            uDepthThreshold: () => -1.0,
            uDepthFeather: () => 0.1,
            uEffectCount: () => localEffect.count,
            uEffectType: () => localEffect.type,
            uEffectP0: () => localEffect.p0,
            uEffectP1: () => localEffect.p1,
            uEffectSpeed: () => localEffect.speed,
            uEffectPhase: () => localEffect.phase,
            uEffectMaskRow: () => localEffect.maskRow,
            uMaskChannel: () => localMask.channel,
            uMaskRangeMin: () => localMask.rangeMin,
            uMaskRangeMax: () => localMask.rangeMax,
            uMaskSpread: () => localMask.spread,
            uMaskWeight: () => localMask.weight,
            uMaskInvert: () => localMask.invert,
          }
        }))
        .go();

      await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

      const out = document.createElement('canvas');
      out.width = gl.width; out.height = gl.height;
      out.getContext('2d').drawImage(gl, 0, 0);

      try { stage.destroy(); } catch (_) { }
      return out;
    }

    /* =========================================================
       FILE / IMAGE HELPERS
       ========================================================= */
    function loadImage(src) {
      return new Promise((res, rej) => {
        const img = new Image();
        img.onload = () => res(img);
        img.onerror = rej;
        img.src = src;
      });
    }
    function download(blob, filename) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    }

    /* =========================================================
       RAW DECODE (libraw-wasm via Blob worker)
       ========================================================= */
    const RAW_EXTS = new Set(['cr2', 'cr3', 'nef', 'nrw', 'arw', 'srf', 'sr2', 'raf', 'orf', 'rw2', 'raw', 'rwl',
      'dng', 'pef', 'ptx', 'srw', 'x3f', '3fr', 'fff', 'iiq', 'k25', 'kdc', 'mef', 'mos', 'mrw', 'erf', 'dcr', 'dcs',
      'ari', 'bay', 'cap', 'cine', 'cs1', 'eip', 'gpr', 'mdc', 'pxn', 'qtk', 'rdc', 'rwz', 'sti']);

    function isRAW(file) {
      const ext = file.name.split('.').pop().toLowerCase();
      return RAW_EXTS.has(ext);
    }

    const RAW_WORKER_SRC = `
self.onmessage = async (ev) => {
  const { id, buffer } = ev.data;
  try {
    importScripts('https://unpkg.com/libraw-wasm@0.21.1/dist/libraw.js');
    if (typeof LibRaw !== 'function') throw new Error('libraw not available');
    const wasm = await LibRaw();
    const raw = wasm.open(new Uint8Array(buffer));
    if (raw && raw.useCameraWhiteBalance) raw.useCameraWhiteBalance();
    const { width, height, data } = raw.toImageData();
    const out = new Uint8ClampedArray(data);
    self.postMessage({ id, ok: true, width, height, data: out.buffer }, [out.buffer]);
  } catch(e){
    self.postMessage({ id, ok: false, error: String(e) });
  }
};
`;

    let rawWorker = null;
    let rawJobId = 0;
    const rawPending = new Map();

    function ensureRawWorker() {
      if (rawWorker) return rawWorker;
      const blob = new Blob([RAW_WORKER_SRC], { type: 'application/javascript' });
      rawWorker = new Worker(URL.createObjectURL(blob));
      rawWorker.onmessage = (ev) => {
        const p = rawPending.get(ev.data.id);
        if (!p) return;
        rawPending.delete(ev.data.id);
        if (ev.data.ok) {
          try {
            const img = new ImageData(new Uint8ClampedArray(ev.data.data), ev.data.width, ev.data.height);
            createImageBitmap(img).then(bmp => p.resolve(bmp));
          } catch (e) { p.reject(e); }
        } else {
          p.reject(new Error(ev.data.error));
        }
      };
      return rawWorker;
    }

    function decodeRAW(file) {
      const w = ensureRawWorker();
      const id = ++rawJobId;
      return new Promise(async (resolve, reject) => {
        rawPending.set(id, { resolve, reject });
        const buf = await file.arrayBuffer();
        w.postMessage({ id, buffer: buf }, [buf]);
      });
    }

    async function decodeAny(file) {
      if (isRAW(file)) {
        const bmp = await decodeRAW(file);
        bmp.__meta = { source: 'raw', filename: file.name };
        return bmp;
      }
      const bmp = await createImageBitmap(file);
      bmp.__meta = { source: 'native', filename: file.name, type: file.type };
      return bmp;
    }

    /* =========================================================
       MANIFEST
       ========================================================= */
    const MANIFEST_SCHEMA = 'lutstudio.manifest/v1';
    function currentImageMeta() {
      if (!sourceImage) return { name: 'unknown', width: 0, height: 0 };
      return {
        name: sourceImage.__meta?.filename || sourceImage.name || 'image',
        width: sourceImage.naturalWidth || sourceImage.width,
        height: sourceImage.naturalHeight || sourceImage.height,
        source: sourceImage.__meta?.source || 'native',
        exif: sourceImage.__meta?.exif || null,
      };
    }
    function buildManifest(state, imageMeta, exportOpts) {
      return {
        schema: MANIFEST_SCHEMA,
        generatedAt: new Date().toISOString(),
        tool: { name: 'LUT Studio Pro', version: '1.0' },
        source: {
          filename: imageMeta.name,
          width: imageMeta.width,
          height: imageMeta.height,
          source: imageMeta.source || 'native',
        },
        geometry: {
          crop: { x: state.geometry.x, y: state.geometry.y, w: state.geometry.w, h: state.geometry.h },
          rotate: state.geometry.rotate,
          flipH: state.geometry.flipH, flipV: state.geometry.flipV,
        },
        grade: {
          basic: pick(state, ['exposure', 'contrast', 'highlights', 'shadows', 'whites', 'blacks',
            'temperature', 'tint', 'vibrance', 'saturation']),
          curves: state.curves,
          splitTone: {
            shadows: { hue: state.splitShadowHue, sat: state.splitShadowSat },
            midtones: { hue: state.splitMidHue, sat: state.splitMidSat },
            highlights: { hue: state.splitHighHue, sat: state.splitHighSat },
            balance: state.splitBalance,
          },
          hsl: state.hsl,
          lutStack: state.luts.map(l => ({ name: l.name, hash: l.hash, size: l.size, strength: l.strength })),
        },
        effects: state.effects.map(e => ({
          type: e.typeId, enabled: e.enabled, params: e.params,
          speed: e.speed, phase: e.phase,
          mask: e.mask ? {
            channel: e.mask.channel,
            rangeMin: e.mask.rangeMin, rangeMax: e.mask.rangeMax,
            spread: e.mask.spread, weight: e.mask.weight,
            invert: e.mask.invert, points: e.mask.points,
          } : null,
        })),
        timeline: { duration: state.timeline.duration, fps: state.timeline.fps },
        output: {
          format: exportOpts.format,
          width: exportOpts.width, height: exportOpts.height,
          quality: exportOpts.quality ?? null,
          frames: exportOpts.frames ?? null,
        },
        hashes: {
          recipe: hashRecipe(state),
        },
      };
    }
    function hashRecipe(state) {
      const s = JSON.stringify({
        g: state.geometry,
        b: pick(state, ['exposure', 'contrast', 'highlights', 'shadows', 'whites', 'blacks', 'temperature', 'tint', 'vibrance', 'saturation']),
        c: state.curves, t: [state.splitShadowHue, state.splitShadowSat,
        state.splitMidHue, state.splitMidSat,
        state.splitHighHue, state.splitHighSat],
        h: state.hsl, l: state.luts.map(l => l.hash),
        e: state.effects.map(e => e.typeId + ':' + JSON.stringify(e.params) + ':' + (e.mask?.channel || '')),
      });
      let h = 5381;
      for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
      return (h >>> 0).toString(36);
    }

    /* =========================================================
       EXPORT — still / animation
       ========================================================= */
    async function exportStill(name, format, quality, maxDim) {
      if (!sourceImage) { alert('Load an image first.'); return; }
      const src = P.effectsEnabled ? glPreviewCanvas : previewCanvas;
      const scale = Math.min(1, maxDim / Math.max(src.width, src.height));
      const outW = Math.max(1, Math.round(src.width * scale));
      const outH = Math.max(1, Math.round(src.height * scale));

      const c = document.createElement('canvas');
      c.width = outW; c.height = outH;
      c.getContext('2d').drawImage(src, 0, 0, outW, outH);

      const mime = format === 'png' ? 'image/png'
        : format === 'webp' ? 'image/webp'
          : 'image/jpeg';
      const blob = await new Promise(r => c.toBlob(r, mime, format !== 'png' ? quality : undefined));
      const ext = format === 'jpeg' ? 'jpg' : format;
      download(blob, `${name}.${ext}`);

      const manifest = buildManifest(P, currentImageMeta(),
        { format, width: outW, height: outH, quality: format !== 'png' ? quality : null });
      await new Promise(r => setTimeout(r, 120));
      download(new Blob([JSON.stringify(manifest, null, 2)], { type: 'application/json' }), `${name}.manifest.json`);
    }

    async function exportWebM(name) {
      if (!P.effectsEnabled) { alert('Enable shader effects first.'); return; }
      if (!mushuFlow) { alert('Effects pipeline not initialised.'); return; }

      // start a fresh playthrough
      stopPreview();
      pipelineTime = 0;
      previewOffset = 0;
      previewStart = performance.now();
      previewPlaying = true;

      const stream = glPreviewCanvas.captureStream(30);
      const rec = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9', videoBitsPerSecond: 12_000_000 });
      const chunks = [];
      rec.ondataavailable = e => chunks.push(e.data);
      const done = new Promise(r => rec.onstop = r);
      rec.start();

      await new Promise(r => setTimeout(r, P.timeline.duration * 1000 + 200));
      previewPlaying = false;
      rec.stop();
      await done;

      const blob = new Blob(chunks, { type: 'video/webm' });
      download(blob, `${name}.webm`);

      const manifest = buildManifest(P, currentImageMeta(),
        {
          format: 'webm', width: glPreviewCanvas.width, height: glPreviewCanvas.height,
          fps: 30, frames: Math.round(P.timeline.duration * 30)
        });
      await new Promise(r => setTimeout(r, 120));
      download(new Blob([JSON.stringify(manifest, null, 2)], { type: 'application/json' }), `${name}.manifest.json`);
    }

    /* =========================================================
       FILE HANDLERS
       ========================================================= */
    fileInput.addEventListener('change', async e => {
      const file = e.target.files[0]; if (!file) return;
      try {
        const bmp = await decodeAny(file);
        sourceImage = bmp;
        imgBtnLabel.classList.add('loaded');
        render();
        commit();
      } catch (err) {
        console.warn('Image load failed', err);
        alert('Could not load: ' + err.message);
      }
      fileInput.value = '';
    });

    depthInput.addEventListener('change', async e => {
      const file = e.target.files[0]; if (!file) return;
      try {
        const img = await loadImage(URL.createObjectURL(file));
        depthImage = img;
        depthBtnLabel.classList.add('loaded');
        packEffects(); // to trigger depth redraw
        render();
        commit();
      } catch (err) { console.warn('Depth load failed', err); }
      depthInput.value = '';
    });

    resetBtn.addEventListener('click', () => {
      if (!confirm('Reset everything?')) return;
      P = defaultState();
      selectedEffectId = null;
      sourceImage = null;
      depthImage = null;
      depthBtnLabel.classList.remove('loaded');
      imgBtnLabel.classList.remove('loaded');
      setEffectsMode(false);
      packEffects();
      buildUI();
      restoreActiveTab();
      commit();
      render();
    });

    undoBtn.addEventListener('click', undo);
    redoBtn.addEventListener('click', redo);

    /* =========================================================
       TABS
       ========================================================= */
    function restoreActiveTab() {
      const activeTab = document.querySelector('.tab.active');
      if (!activeTab) return;
      document.querySelectorAll('.panel-body').forEach(p => p.classList.remove('active'));
      const panel = document.querySelector(`[data-panel="${activeTab.dataset.tab}"]`);
      if (panel) panel.classList.add('active');
    }
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel-body').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.querySelector(`[data-panel="${tab.dataset.tab}"]`).classList.add('active');
        updateCropOverlay();
        scheduleSave();
      });
    });

    /* =========================================================
       KEYBOARD
       ========================================================= */
    document.addEventListener('keydown', e => {
      const mod = e.metaKey || e.ctrlKey;
      if (!mod) return;
      const k = e.key.toLowerCase();
      if (k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
      else if ((k === 'z' && e.shiftKey) || k === 'y') { e.preventDefault(); redo(); }
    });

    /* =========================================================
       SAVE ON UNLOAD
       ========================================================= */
    window.addEventListener('beforeunload', () => {
      if (saveTimer) { clearTimeout(saveTimer); saveNow(); }
    });
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden' && saveTimer) { clearTimeout(saveTimer); saveNow(); }
    });

    /* =========================================================
       BOOT
       ========================================================= */
    async function boot() {
      bindTimeline();

      /* Restore saved state */
      const saved = loadSaved();
      if (saved && saved.state) {
        try {
          const s = saved.state;
          // rebuild state on top of defaults so missing keys are filled
          const def = defaultState();
          P = Object.assign(def, s);
          if (!P.effects) P.effects = [];
          if (!P.luts) P.luts = [];
          if (!P.geometry) P.geometry = { x: 0, y: 0, w: 1, h: 1, aspect: null, rotate: 0, flipH: false, flipV: false };
          if (!P.timeline) P.timeline = { duration: 4, fps: 24 };
        } catch (_) { P = defaultState(); }
      }
      if (saved && saved.activeTab) {
        document.querySelectorAll('.tab').forEach(t => {
          t.classList.toggle('active', t.dataset.tab === saved.activeTab);
        });
      }

      /* Restore LUTs from IDB */
      try {
        const stored = await idbAll('luts');
        for (const rec of stored) {
          const data = new Float32Array(rec.buffer);
          P.luts.push({
            hash: rec.hash, name: rec.name, size: rec.size, strength: 1,
            lut: {
              name: rec.name, size: rec.size, dim: 3, data,
              domainMin: rec.domainMin || [0, 0, 0], domainMax: rec.domainMax || [1, 1, 1]
            },
          });
        }
      } catch (e) { /* ignore */ }

      /* Restore user presets from IDB */
      try {
        const stored = await idbAll('presets');
        P.presets = stored;
      } catch (e) { /* ignore */ }

      /* Init mask atlas */
      packEffects();

      buildUI();
      restoreActiveTab();

      /* Fallback blank image */
      if (!sourceImage) {
        const blank = document.createElement('canvas');
        blank.width = 800; blank.height = 600;
        const bctx = blank.getContext('2d');
        const grd = bctx.createLinearGradient(0, 0, 800, 600);
        grd.addColorStop(0, '#1a1f27'); grd.addColorStop(1, '#2a3040');
        bctx.fillStyle = grd; bctx.fillRect(0, 0, 800, 600);
        bctx.fillStyle = '#5b8cff'; bctx.font = 'bold 30px sans-serif'; bctx.textAlign = 'center';
        bctx.fillText('Load an image or drop a RAW', 400, 290);
        bctx.fillStyle = '#5f6b7a'; bctx.font = '15px sans-serif';
        bctx.fillText('Everything is saved automatically', 400, 330);
        sourceImage = await loadImage(blank.toDataURL());
        sourceImage.__meta = { source: 'placeholder' };
      }

      render();

      /* Seed history */
      historyStack = [{ snap: snapshot(), t: Date.now() }];
      historyIndex = 0;
      updateHistoryButtons();
    }

    boot();

  </script>
</body>

</html>
