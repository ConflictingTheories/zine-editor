# SVRN Publisher — full dev stack.
#
# One command:
#   docker compose up --build
#
# Then:
#   API      http://localhost:3000/api/health
#   Postgres localhost:5432 (svrn/svrn)
#
# The server runs migrations on boot. Data persists in named volumes:
#   pgdata       — Postgres
#   svrn-data    — sqlite fallback, disk asset store, .svrn packages

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: svrn
      POSTGRES_PASSWORD: svrn
      POSTGRES_DB: svrn
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U svrn -d svrn"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://svrn:svrn@db:5432/svrn
      JWT_SECRET: ${JWT_SECRET:-dev_docker_secret_must_be_changed_in_prod}
      JWT_EXPIRY: 7d
      CORS_ORIGIN: http://localhost:3000,http://localhost:5173,http://localhost:80
      ASSET_STORE: disk
      ASSET_STORE_PATH: /app/server/data/assets
      SVRN_PACKAGES_PATH: /app/server/data/svrn-packages
      ALLOW_DEMO_ACCOUNT: "false"
      # STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      # STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      # STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    volumes:
      - svrn-data:/app/server/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  pgdata:
  svrn-data:
