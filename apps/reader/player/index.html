<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SVRN Player</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  #player-root { width: 100%; height: 100%; }
  #player-root canvas { width: 100%; height: 100%; display: block; }
  .player-status { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #ececf1; font-family: system-ui, sans-serif; gap: 12px; }
  .player-status .spinner { width: 32px; height: 32px; border: 3px solid rgba(255,255,255,.2); border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .player-error { max-width: 420px; text-align: center; padding: 24px; }
  .player-error h2 { font-size: 18px; margin: 0 0 8px; }
  .player-error p { font-size: 14px; opacity: .7; margin: 0; }
</style>
</head>
<body>
<div id="player-root"></div>
<div id="player-status" class="player-status">
  <div class="spinner"></div>
  <div>Loading player…</div>
</div>
<script type="module" src="./bootstrap.js"></script>
</body>
</html>
