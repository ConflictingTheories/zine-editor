worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;

  # ── Rate limiting zones ──────────────────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=api_general:10m   rate=60r/m;
  limit_req_zone $binary_remote_addr zone=api_auth:10m      rate=10r/m;
  limit_req_zone $binary_remote_addr zone=api_payments:10m  rate=20r/m;

  # ── Gzip ─────────────────────────────────────────────────────────────────
  gzip on;
  gzip_types text/plain text/css application/json application/javascript;

  # ── Redirect HTTP to HTTPS ────────────────────────────────────────────────
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  # ── HTTPS ─────────────────────────────────────────────────────────────────
  server {
    listen 443 ssl;
    server_name yourdomain.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # ── Stripe webhook — raw body required, no rate limit tampering ────────
    location = /api/payments/webhook {
      proxy_pass         http://backend:4000;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_request_buffering off;   # stream body directly so signature validates
    }

    # ── Auth endpoints — strict rate limiting ─────────────────────────────
    location ~ ^/api/(auth/login|auth/register) {
      limit_req zone=api_auth burst=5 nodelay;
      proxy_pass http://backend:4000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Payment endpoints ─────────────────────────────────────────────────
    location /api/payments/ {
      limit_req zone=api_payments burst=10 nodelay;
      proxy_pass http://backend:4000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # ── General API ───────────────────────────────────────────────────────
    location /api/ {
      limit_req zone=api_general burst=20 nodelay;
      proxy_pass         http://backend:4000;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_http_version 1.1;
    }

    # ── Frontend (static SPA) ─────────────────────────────────────────────
    location / {
      proxy_pass         http://frontend:80;
      proxy_set_header   Host $host;
      proxy_http_version 1.1;
    }
  }
}
